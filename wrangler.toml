# Cloudflare Pages: required so CI accepts this project as a valid Pages Wrangler project.
# Without `pages_build_output_dir`, Pages skips Wrangler config and static upload misses the Worker layout.
# Do not set `main` here — that path only exists after `astro build` (see dist/server/wrangler.json).
name = "localstack-docs"
pages_build_output_dir = "./dist"
compatibility_date = "2026-04-18"
compatibility_flags = ["nodejs_compat"]
